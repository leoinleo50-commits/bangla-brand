<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bangla Brand — V2 Storefront</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070B19;
      --card: rgba(18, 26, 47, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --cyan: #06B6D4;
      --purple: #8B5CF6;
      --amber: #F59E0B;
      --text: #F1F5F9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Hind Siliguri', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 60px; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); }
    .logo { font-size: 20px; font-weight: 700; color: var(--cyan); }
    .btn-admin { padding: 8px 14px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: #fff; border-radius: 8px; text-decoration: none; font-size: 13px; }

    .grid-prods { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 20px; }
    .p-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .p-box img { width: 100%; height: 180px; object-fit: cover; }
    .p-info { padding: 12px; }
    .p-title { font-weight: 700; font-size: 15px; }
    .p-price { color: var(--amber); font-weight: 700; font-size: 16px; margin-top: 4px; }
    .btn-buy { width: 100%; padding: 8px; background: var(--cyan); border: none; color: #070B19; font-weight: 700; border-radius: 8px; margin-top: 8px; cursor: pointer; }

    /* অর্ডার মডাল */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: #121A2F; border: 1px solid var(--border); border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; }
    .inp { width: 100%; padding: 8px 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--border); background: #070B19; color: #fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">🛍️ Bangla Brand Store V2</div>
      <a href="admin.html" class="btn-admin">⚙️ অ্যাডমিন প্যানেল</a>
    </header>

    <h2 style="margin-top:20px;">আমাদের পণ্যসমূহ</h2>
    <div class="grid-prods" id="store-prods"></div>
  </div>

  <div class="modal" id="buy-modal">
    <div class="modal-box">
      <h3>অর্ডার বুকিং ফর্ম</h3>
      <p id="m-prod-name" style="color:var(--cyan);margin-bottom:12px;"></p>
      <form onsubmit="placeOrder(event)">
        <input type="text" id="c-name" class="inp" placeholder="আপনার নাম" required />
        <input type="text" id="c-phone" class="inp" placeholder="ফোন নম্বর" required />
        <input type="text" id="c-addr" class="inp" placeholder="ঠিকানা" required />
        <button type="submit" class="btn-buy" style="background:var(--amber);">অর্ডার কনফার্ম করুন</button>
        <button type="button" onclick="closeModal()" class="btn-buy" style="background:transparent;color:#fff;border:1px solid var(--border);margin-top:4px;">বাতিল</button>
      </form>
    </div>
  </div>

  <script>
    const DB_KEY = "BB_COMMERCE_BRAIN_DB_V1";
    let selectedP = null;

    function loadDB() {
      try { return JSON.parse(localStorage.getItem(DB_KEY) || "{}") || {}; } catch(e){ return {}; }
    }

    function renderStore() {
      const db = loadDB();
      const prods = db.products || [];
      document.getElementById("store-prods").innerHTML = prods.length ? prods.map(p => `
        <div class="p-box">
          <img src="${p.image}" />
          <div class="p-info">
            <div class="p-title">${p.title}</div>
            <div class="p-price">৳${p.price}</div>
            <button class="btn-buy" onclick="openBuyModal('${p.id}')">অর্ডার করুন</button>
          </div>
        </div>
      `).join("") : `<p style="color:var(--text-muted);">কোনো পণ্য যুক্ত করা হয়নি।</p>`;
    }

    function openBuyModal(id) {
      const db = loadDB();
      selectedP = (db.products || []).find(x => x.id === id);
      if(!selectedP) return;
      document.getElementById("m-prod-name").textContent = `${selectedP.title} (৳${selectedP.price})`;
      document.getElementById("buy-modal").style.display = "flex";
    }
    function closeModal() { document.getElementById("buy-modal").style.display = "none"; }

    function placeOrder(e) {
      e.preventDefault();
      const db = loadDB();
      db.orders = db.orders || [];
      db.orders.unshift({
        id: "ORD-" + Math.floor(1000 + Math.random()*9000),
        name: document.getElementById("c-name").value,
        phone: document.getElementById("c-phone").value,
        address: document.getElementById("c-addr").value,
        productTitle: selectedP.title,
        qty: 1,
        total: selectedP.price + 100,
        status: "Pending",
        date: new Date().toISOString().slice(0,10)
      });
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      closeModal();
      alert("অর্ডার সফলভাবে গ্রহণ করা হয়েছে!");
    }

    renderStore();
  </script>
</body>
</html>
