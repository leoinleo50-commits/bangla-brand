<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bangla Brand — Store & All Reels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- =====================================================================
       [শুরু] ১. স্টাইল ও ডিজাইন (CSS)
       ===================================================================== -->
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --success: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Hind Siliguri', sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }

    header.top { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 30; }
    .top-in { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .brand { font-size: 19px; font-weight: 700; color: var(--primary); }

    .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-success { background: var(--success); color: #fff; border-color: var(--success); }

    .search-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .search-row input { flex: 1; min-width: 220px; padding: 9px 12px; border-radius: 8px; border: 1px solid #cbd5e1; background: var(--surface); font-family: inherit; font-size: 14px; }

    .cats { display: flex; gap: 8px; overflow-x: auto; margin: 14px 0; padding-bottom: 4px; }
    .cat-btn { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 185px; object-fit: cover; background: var(--surface-2); }
    .card-body { padding: 14px; }
    .code-pill { font-size: 11.5px; background: #eff6ff; color: var(--primary); border: 1px solid #bfdbfe; padding: 2px 8px; border-radius: 6px; font-weight: 700; display: inline-block; margin-bottom: 4px; }
    .card-title { font-size: 16px; font-weight: 700; margin: 2px 0; }
    .card-meta { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
    .card-foot { padding: 0 14px 14px; display: flex; justify-content: space-between; align-items: center; }
    .price { font-size: 17px; font-weight: 700; }

    /* হোম পেজে ফুটারের ঠিক ওপরে রিল সেকশন */
    .above-footer-reels {
      margin-top: 34px;
      margin-bottom: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }
    .reels-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 12px;
    }
    .reel-thumb-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .reel-thumb-card:hover { transform: translateY(-2px); border-color: var(--primary); }
    .reel-thumb-card video {
      width: 100%;
      height: 210px;
      object-fit: cover;
      border-radius: 8px;
      background: #0f172a;
      pointer-events: none;
    }

    /* অল রিল ভিউ (All Reels) */
    #all-reels-view { display: none; }
    .all-reels-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 16px; margin-top: 14px; }
    .all-reel-box {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .all-reel-box.playing-now { border-color: var(--primary); box-shadow: 0 8px 24px rgba(37, 99, 235, 0.14); }
    .all-reel-box video { width: 100%; height: 310px; object-fit: cover; border-radius: 10px; background: #0f172a; margin-bottom: 10px; }

    footer.site-footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 18px 16px;
      margin-top: 10px;
      text-align: center;
      font-size: 13.5px;
      color: var(--muted);
    }

    .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
    .modal-box { background: var(--surface); border-radius: 12px; padding: 20px; width: 100%; max-width: 430px; border: 1px solid var(--border); }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .field input, .field select { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid #cbd5e1; font-family: inherit; font-size: 14px; }
  </style>
  <!-- =====================================================================
       [শেষ] ১. স্টাইল ও ডিজাইন (CSS)
       ===================================================================== -->
</head>
<body>
  <!-- =====================================================================
       [শুরু] ২. টপ হেডার
       ===================================================================== -->
  <header class="top">
    <div class="top-in">
      <div class="brand" style="cursor:pointer;" onclick="showHomeView()">Bangla Brand Store</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn" onclick="openAllReelsView()">🎬 All Reels</button>
        <a class="btn" href="admin.html">⚙️ অ্যাডমিন</a>
      </div>
    </div>
  </header>
  <!-- =====================================================================
       [শেষ] ২. টপ হেডার
       ===================================================================== -->

  <!-- =====================================================================
       [শুরু] ৩. হোম ভিউ (সার্চ, ক্যাটাগরি, প্রোডাক্ট ও ফুটারের ওপরে রিল)
       ===================================================================== -->
  <main class="wrap" id="home-view">
    <div class="search-row">
      <input type="text" id="code-search" placeholder="প্রোডাক্ট কোড (যেমন: PRD-1001) বা নাম দিয়ে সার্চ করুন..." oninput="renderHome()" />
      <button class="btn btn-primary" onclick="renderHome()">সার্চ</button>
    </div>

    <div class="cats" id="cat-bar"></div>
    <section class="grid" id="store-grid"></section>

    <section class="above-footer-reels">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <div>
          <h2 style="font-size:19px;">🎬 শর্ট প্রোডাক্ট রিলস</h2>
          <p style="font-size:13px;color:var(--muted);">যেকোনো রিলে ক্লিক করলে All Reels পেজে গিয়ে সেই রিলটি চালু হবে।</p>
        </div>
        <button class="btn btn-primary" onclick="openAllReelsView()">সব রিল দেখুন →</button>
      </div>
      <div class="reels-strip" id="home-reels-strip"></div>
    </section>
  </main>
  <!-- =====================================================================
       [শেষ] ৩. হোম ভিউ
       ===================================================================== -->

  <!-- =====================================================================
       [শুরু] ৪. অল রিল ভিউ (সব রিল ও ক্লিক করা রিল চালু)
       ===================================================================== -->
  <main class="wrap" id="all-reels-view">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
      <div>
        <h1 style="font-size:21px;">All Reels</h1>
        <p style="font-size:13px;color:var(--muted);">ক্লিক করা রিলটি চালু হয়েছে; এখান থেকে যেকোনো রিল দেখে অর্ডার করতে পারবেন।</p>
      </div>
      <button class="btn" onclick="showHomeView()">← হোমে ফিরে যান</button>
    </div>
    <section class="all-reels-grid" id="all-reels-grid"></section>
  </main>
  <!-- =====================================================================
       [শেষ] ৪. অল রিল ভিউ
       ===================================================================== -->

  <!-- =====================================================================
       [শুরু] ৫. ফুটার সেকশন
       ===================================================================== -->
  <footer class="site-footer">
    © ২০২৬ Bangla Brand Store — নিরাপদ শপিং ও দ্রুত ডেলিভারি
  </footer>
  <!-- =====================================================================
       [শেষ] ৫. ফুটার সেকশন
       ===================================================================== -->

  <!-- =====================================================================
       [শুরু] ৬. অর্ডার মডাল
       ===================================================================== -->
  <div class="modal" id="order-modal">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h3>অর্ডার করুন</h3>
        <button class="btn" onclick="closeOrderModal()">✕</button>
      </div>
      <div id="ord-prod-banner" style="font-size:13px;color:var(--primary);font-weight:700;margin-bottom:10px;"></div>
      <form onsubmit="submitOrder(event)">
        <div class="field"><label>নাম *</label><input type="text" id="o-name" required /></div>
        <div class="field"><label>মোবাইল নম্বর *</label><input type="text" id="o-phone" required /></div>
        <div class="field"><label>ঠিকানা *</label><input type="text" id="o-addr" required /></div>
        <div class="field"><label>সাইজ কার্ট</label><select id="o-size"></select></div>
        <div class="field" id="variant-wrap" style="display:none;"><label>ভেরিয়েন্ট</label><select id="o-variant"></select></div>
        <div class="field"><label>পরিমাণ</label><input type="number" id="o-qty" value="1" min="1" oninput="updateOrderTotal()" /></div>
        <div class="field">
          <label>ডেলিভারি এলাকা</label>
          <select id="o-area" onchange="updateOrderTotal()">
            <option value="inside">ঢাকার ভেতরে (৳70)</option>
            <option value="outside" selected>ঢাকার বাইরে (৳120)</option>
          </select>
        </div>
        <div id="o-total-txt" style="font-size:15px;font-weight:700;margin-bottom:12px;"></div>
        <button type="submit" class="btn btn-success" style="width:100%;justify-content:center;">অর্ডার কনফার্ম করুন</button>
      </form>
    </div>
  </div>
  <!-- =====================================================================
       [শেষ] ৬. অর্ডার মডাল
       ===================================================================== -->

  <!-- =====================================================================
       [শুরু] ৭. জাভাস্ক্রিপ্ট ইঞ্জিন
       ===================================================================== -->
  <script>
    const DB_KEY = "BB_COMMERCE_V3_DB";
    let activeCat = "ALL";
    let selectedProd = null;

    function esc(v) {
      return String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function loadDB() {
      try { return JSON.parse(localStorage.getItem(DB_KEY) || "{}") || {}; } catch (e) { return {}; }
    }

    function showHomeView() {
      document.querySelectorAll("main video").forEach(v => v.pause());
      document.getElementById("all-reels-view").style.display = "none";
      document.getElementById("home-view").style.display = "block";
      renderHome();
    }

    function openAllReelsView(selectedReelId = null) {
      document.getElementById("home-view").style.display = "none";
      document.getElementById("all-reels-view").style.display = "block";
      renderAllReels(selectedReelId);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderHome() {
      const db = loadDB();
      const prods = db.products || [];
      const cats = ["ALL", ...(db.categories || [])];
      const q = (document.getElementById("code-search").value || "").trim().toLowerCase();

      document.getElementById("cat-bar").innerHTML = cats.map(c => `
        <button class="cat-btn ${activeCat === c ? "active" : ""}" onclick="setCat('${esc(c)}')">${c === "ALL" ? "সব ক্যাটাগরি" : esc(c)}</button>
      `).join("");

      const filtered = prods.filter(p => {
        const okCat = activeCat === "ALL" || p.category === activeCat;
        const okQ = !q ||
          String(p.code || "").toLowerCase().includes(q) ||
          String(p.title || "").toLowerCase().includes(q) ||
          String(p.category || "").toLowerCase().includes(q);
        return okCat && okQ;
      });

      document.getElementById("store-grid").innerHTML = filtered.length ? filtered.map(p => `
        <article class="card">
          <div>
            <img src="${esc(p.image)}" alt="${esc(p.title)}" />
            <div class="card-body">
              <span class="code-pill">কোড: ${esc(p.code)}</span>
              <div class="card-title">${esc(p.title)}</div>
              <div class="card-meta">${esc(p.category)} • স্টক: ${esc(p.stock)}</div>
              <div class="card-meta">সাইজ: ${esc((p.sizes || []).join(", ") || "Free Size")}</div>
            </div>
          </div>
          <div class="card-foot">
            <span class="price">৳${esc(p.price)}</span>
            <button class="btn btn-primary" onclick="openOrderByCode('${esc(p.code)}')">অর্ডার করুন</button>
          </div>
        </article>
      `).join("") : `<p style="color:var(--muted);">কোনো পণ্য পাওয়া যায়নি।</p>`;

      const reels = db.reels || [];
      document.getElementById("home-reels-strip").innerHTML = reels.length ? reels.map(r => `
        <div class="reel-thumb-card" onclick="openAllReelsView('${esc(r.id)}')">
          <video src="${esc(r.videoUrl)}" muted preload="metadata"></video>
          <div style="font-weight:700;font-size:14.5px;margin-top:8px;">${esc(r.title)}</div>
          <div style="font-size:12px;color:var(--primary);font-weight:600;margin-top:2px;">▶ ক্লিক করে রিল চালু করুন (${esc(r.productCode)})</div>
        </div>
      `).join("") : `<p style="color:var(--muted);">এখনো কোনো রিল যুক্ত করা হয়নি।</p>`;
    }

    function renderAllReels(targetReelId = null) {
      const db = loadDB();
      const reels = db.reels || [];
      const prods = db.products || [];
      const grid = document.getElementById("all-reels-grid");

      if (!reels.length) {
        grid.innerHTML = `<p style="color:var(--muted);">কোনো রিল পাওয়া যায়নি।</p>`;
        return;
      }

      grid.innerHTML = reels.map(r => {
        const linkedProd = prods.find(p => p.code === r.productCode);
        const isTarget = targetReelId === r.id;
        return `
          <article class="all-reel-box ${isTarget ? "playing-now" : ""}" id="all-reel-${esc(r.id)}">
            <div>
              <video id="play-vid-${esc(r.id)}" src="${esc(r.videoUrl)}" controls playsinline ${isTarget ? "autoplay" : ""}></video>
              <div style="font-weight:700;font-size:16px;margin-bottom:4px;">${esc(r.title)}</div>
              <div style="font-size:13px;color:var(--muted);margin-bottom:10px;">
                কোড: <span class="code-pill">${esc(r.productCode)}</span>
                ${linkedProd ? ` • <strong>${esc(linkedProd.title)}</strong> (৳${esc(linkedProd.price)})` : ""}
              </div>
            </div>
            <button class="btn btn-success" style="width:100%;justify-content:center;" onclick="openOrderByCode('${esc(r.productCode)}')">
              🛒 এই রিল থেকে অর্ডার করুন (${esc(r.productCode)})
            </button>
          </article>
        `;
      }).join("");

      if (targetReelId) {
        const cardEl = document.getElementById("all-reel-" + targetReelId);
        const vidEl = document.getElementById("play-vid-" + targetReelId);
        if (cardEl) cardEl.scrollIntoView({ behavior: "smooth", block: "center" });
        if (vidEl) vidEl.play().catch(() => {});
      }
    }

    function setCat(c) { activeCat = c; renderHome(); }

    function openOrderByCode(code) {
      const db = loadDB();
      selectedProd = (db.products || []).find(p => p.code === code);
      if (!selectedProd) return alert(`কোড (${code}) পাওয়া যায়নি।`);
      document.getElementById("ord-prod-banner").textContent = `${selectedProd.title} [কোড: ${selectedProd.code}] — ৳${selectedProd.price}`;
      const sizes = selectedProd.sizes && selectedProd.sizes.length ? selectedProd.sizes : ["Free Size"];
      document.getElementById("o-size").innerHTML = sizes.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
      const hasVar = selectedProd.type === "Variant" && (selectedProd.variants || []).length > 0;
      document.getElementById("variant-wrap").style.display = hasVar ? "block" : "none";
      if (hasVar) {
        document.getElementById("o-variant").innerHTML = selectedProd.variants.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join("");
      }
      document.getElementById("o-qty").value = 1;
      updateOrderTotal();
      document.getElementById("order-modal").style.display = "flex";
    }

    function closeOrderModal() { document.getElementById("order-modal").style.display = "none"; selectedProd = null; }

    function updateOrderTotal() {
      if (!selectedProd) return;
      const qty = Math.max(1, Number(document.getElementById("o-qty").value) || 1);
      const ship = document.getElementById("o-area").value === "inside" ? 70 : 120;
      document.getElementById("o-total-txt").textContent = `মোট টাকা: ৳${Number(selectedProd.price) * qty + ship}`;
    }

    function submitOrder(e) {
      e.preventDefault();
      if (!selectedProd) return;
      const db = loadDB();
      db.orders = db.orders || [];
      const qty = Math.max(1, Number(document.getElementById("o-qty").value) || 1);
      const ship = document.getElementById("o-area").value === "inside" ? 70 : 120;
      const hasVar = selectedProd.type === "Variant" && (selectedProd.variants || []).length > 0;
      const ord = {
        id: "ORD-" + Math.floor(1000 + Math.random() * 9000),
        name: document.getElementById("o-name").value.trim(),
        phone: document.getElementById("o-phone").value.trim(),
        address: document.getElementById("o-addr").value.trim(),
        productCode: selectedProd.code,
        productTitle: selectedProd.title,
        size: document.getElementById("o-size").value,
        variant: hasVar ? document.getElementById("o-variant").value : "Single",
        qty,
        shipping: ship,
        total: Number(selectedProd.price) * qty + ship,
        status: "Pending",
        date: new Date().toISOString().slice(0, 10)
      };
      db.orders.unshift(ord);
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      closeOrderModal();
      alert(`অর্ডার (#${ord.id}) সম্পন্ন হয়েছে!`);
    }

    renderHome();
  </script>
  <!-- =====================================================================
       [শেষ] ৭. জাভাস্ক্রিপ্ট ইঞ্জিন
       ===================================================================== -->
</body>
</html>
